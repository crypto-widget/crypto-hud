[workspace]
resolver = "2"
members = [
    "crates/crypto-hud-core",
    "crates/crypto-hud-market",
    "crates/crypto-hud-runtime",
    "crates/crypto-hud-shell-state",
    "crates/crypto-hud-taskbar",
    "crates/crypto-hud",
]

[workspace.package]
edition = "2021"
version = "1.0.3"
authors = ["Crypto HUD Contributors"]
license = "MIT"
repository = "https://github.com/crypto-widget/crypto-hud"
homepage = "https://github.com/crypto-widget/crypto-hud"
readme = "README.md"
rust-version = "1.96"
publish = false

[workspace.dependencies]
# Keep ureq's shared TLS implementation above the RUSTSEC-2026-0285 fix.
rustls = { version = "0.23.45", default-features = false }
